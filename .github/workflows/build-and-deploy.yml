name: Build and Deploy

# Every push and PR builds both the web app and the desktop app (Windows + Linux).
# - Pushes to main deploy the web app to GitHub Pages.
# - Version tags (`npm run release` creates and pushes one) also publish a draft GitHub release
#   with the desktop installers attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # for creating releases from tags
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IS_MAIN_PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Install librsvg
        # For converting SVG to PNG, e.g. for apple-touch-icon
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Generate PNG icons
        run: npm run png

      - name: Build
        run: npm run build

      - name: Setup Pages
        if: env.IS_MAIN_PUSH == 'true'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: env.IS_MAIN_PUSH == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  desktop:
    needs: web # don't spend time on native builds if lint or the web build fails
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
          - platform: ubuntu-22.04
            name: linux

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      # Without a tag name this only builds; with one it also creates/updates the draft release
      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.IS_TAG == 'true' && github.ref_name || '' }}
          releaseName: 'Coil ${{ github.ref_name }}'
          releaseBody: 'Desktop builds of Coil. Download the installer for your platform below.'
          releaseDraft: true

      - name: Upload installers
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coil-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
